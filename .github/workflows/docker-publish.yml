name: Publish Docker image

# Builds the AspireUI container and publishes it to GitHub Container Registry
# (ghcr.io/fgilde/aspireui) so anyone can `docker run` / reference it as an Aspire resource
# without building locally. Pushes :latest for master, a version tag for git tags, and a
# short-sha tag for every build.
#
# Multi-arch (amd64 + arm64). The arm64 `protoc` bundled with Grpc.Tools 2.80.0 segfaults
# (exit 139) on the Aspire dashboard proto, under QEMU and natively on ubuntu-24.04-arm alike,
# so the Dockerfile compiles on $BUILDPLATFORM (amd64) and only the runtime stage is built for
# the target arch — the publish output is portable IL. Emulated arm64 apt/dotnet-tool steps make
# that leg slow (~2-3x), which is why the layer cache below matters.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the SPA version is 0.1.<commit count>

      - name: Version
        id: ver
        run: |
          echo "app=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short HEAD) · $(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fgilde/aspireui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app }}
            APP_BUILD=${{ steps.ver.outputs.build }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  # Real arm64 hardware, because QEMU cannot verify this: the emulated .NET runtime aborts
  # (AccessViolation / signal 6) on any non-trivial app, so a passing local emulated build says

  # CasaOS consumes a custom app source as a zip whose root is a `build/sysroot/...` tree (that is
  # what IceWhale's own store CI produces). Build ours from store/casaos/ and keep it at a fixed
  # release tag, so the URL a user pastes into CasaOS never changes.
  casaos-store:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the CasaOS app-source archive
        run: |
          set -euo pipefail
          root="build/sysroot/var/lib/casaos/appstore/default.new"
          mkdir -p "$root"
          cp -r store/casaos/Apps "$root/"
          cp store/casaos/category-list.json store/casaos/featured-apps.json              store/casaos/recommend-list.json store/casaos/README.md "$root/"
          zip -rq casaos-appstore.zip build
          unzip -t casaos-appstore.zip >/dev/null
      - name: Publish it at the stable store tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view store >/dev/null 2>&1             || gh release create store --title "App store packages" --notes "CasaOS app source for AspireUI. Add the zip URL below under App Store → Add source." --latest=false
          gh release upload store casaos-appstore.zip --clobber

  # nothing about the arm64 image actually running.
  smoke-arm64:
    needs: build-push
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start the arm64 image and wait for the web UI
        run: |
          set -euo pipefail
          image="ghcr.io/fgilde/aspireui@${{ needs.build-push.outputs.digest }}"
          docker run -d --name aspireui -p 8080:8080 "$image"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ || true)"
            case "$code" in 200|302) echo "serving (HTTP $code)"; break ;; esac
            if [ "$i" = 60 ]; then docker logs aspireui; echo "no HTTP response" >&2; exit 1; fi
            sleep 5
          done
          docker exec aspireui aspire --version
          docker exec aspireui docker compose version
          docker exec aspireui dotnet --version
